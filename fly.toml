# fly.toml app configuration file generated for mcnp-puller
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'mcnp-puller'
primary_region = 'sin'

[build]

[env]
  PORT = "8080"
  MC_HOST = "play.mcnp.network"
  MC_PORT = "25565"
  MC_USERNAME = "_QuickPuller"
  MC_PASSWORD = "tynorix"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
